manifestVersion: 1
id: m45-gopool
category: bitcoin
name: M45 goPool
version: "0.1.5"
tagline: Run a private solo Bitcoin mining pool
description: >-
  M45 goPool connects your miners directly to your Umbrel Bitcoin Node and
  provides Stratum v1, per-worker statistics, saved workers, best-share
  tracking, and a local status dashboard.


  This community package is configured for Bitcoin mainnet. It charges a 2%
  pool fee to 3B86bWqfjdQeLEr8nkeeWU6ygksc2K7MoL; the remaining 98% of a
  block reward is paid to the valid Bitcoin address supplied as the miner's
  Stratum username. The optional operator-donation split is disabled.


  Setup guide and user manual: https://m45core.com/umbrel
developer: M45Core
website: https://m45core.com/umbrel
submitter: M45Core
submission: https://github.com/M45-Software/M45-Umbrel-Community-App-Store
dependencies:
  - bitcoin
repo: https://github.com/M45-Software/M45-goPool
support: https://m45core.com/umbrel
port: 23080
icon: https://raw.githubusercontent.com/M45-Software/M45-goPool/main/data/M45CORE-1024.PNG
gallery:
  - https://github.com/M45-Software/M45-goPool/releases/download/v0.1.5/umbrel-dashboard.png
path: ""
releaseNotes: |-
  - A block accepted after a restart or RPC interruption now appears once in found-block history. Replay uses the same Discord announcement and subscriber pings as a live find. Receiving the same block again does not repeat the alerts.
  - Failed local database backups retry at the next scheduled interval, even if the database is unchanged. Local snapshots and Backblaze uploads track success independently.
  - Pull requests now test block acceptance against Bitcoin Core 28.1 on regtest. Release builds use Go 1.27.4.
  
  [Full changelog](https://github.com/M45-Software/M45-goPool/compare/v0.1.4...v0.1.5)
  
  
  
  Full release: https://github.com/M45-Software/M45-goPool/releases/tag/v0.1.5
defaultUsername: ""
defaultPassword: ""
backupIgnore:
  - data/logs
  - data/certbot-webroot
